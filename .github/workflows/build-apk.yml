
name: Build FutbolZone APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Extract uploaded ZIP
        run: |
          if [ ! -f FutbolZone_CloudBuild_FIXED.zip ]; then
            echo "ZIP fayl topilmadi"
            ls -la
            exit 1
          fi
          unzip -o FutbolZone_CloudBuild_FIXED.zip -d extracted
          if [ -d extracted/FutbolZone_Android_Project ]; then
            cp -a extracted/FutbolZone_Android_Project/. .
          else
            cp -an extracted/. .
          fi

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: FutbolZone-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
